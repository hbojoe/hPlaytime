prefix: "&8[&ahPlaytime&8] &r"
no-permission: "%prefix%&cYou do not have permission to do that."
player-only: "%prefix%&cOnly players can use that command without a player name."
usage-playtime: "%prefix%&cUsage: /playtime [player], /playtime player <player>, /playtime top, /playtime topday, or /playtime topmonth"
usage-admin: "%prefix%&cUsage: /hplaytime reload, /hplaytime reset <player>, or /hplaytime resetall"
usage-event: "%prefix%&cUsage: /playtime event create <name> <duration>, /playtime start <name>, /event delete <name>"
unknown-player: "%prefix%&cNo playtime data was found for &f%player%&c."
reloaded: "%prefix%&aLanguage file reloaded."
reload-failed: "%prefix%&cReload failed. Check the console for details."
reset-player: "%prefix%&aReset main playtime for &f%player%&a."
reset-failed: "%prefix%&cCould not reset main playtime for &f%player%&c. Check the console."
reset-all: "%prefix%&aReset main playtime for all players."
reset-all-failed: "%prefix%&cCould not reset all main playtime. Check the console."

event-created: "%prefix%&aCreated event &f%event% &afor &f%duration%&a. Start it with &f/playtime start %event%&a."
event-invalid-name: "%prefix%&cEvent names may only use letters, numbers, underscores, and hyphens, up to 32 characters."
event-invalid-duration: "%prefix%&cInvalid duration. Examples: 24h, 7d, 1h30m, 45m."
event-already-exists: "%prefix%&cEvent &f%event% &calready exists."
event-not-found: "%prefix%&cEvent &f%event% &cdoes not exist."
event-already-active: "%prefix%&cEvent &f%event% &cis already active."
event-not-active: "%prefix%&cEvent &f%event% &cis not active."
event-started: "%prefix%&aStarted event &f%event%&a. Event playtime starts fresh now."
event-ended-manual: "%prefix%&aEnded event &f%event%&a and wrote an event log."
event-deleted: "%prefix%&aDeleted event &f%event%&a tracking files. Existing event logs were kept."
event-list: "%prefix%&aEvents: &f%events%"

event-ended:
  - "%prefix%&aEvent &f%event% &ahas ended!"
  - "&7Highest playtime: &f%player% &7with &f%time%"
event-ended-no-players:
  - "%prefix%&aEvent &f%event% &ahas ended!"
  - "&7No playtime was tracked for this event."

playtime:
  - "%prefix%&aPlaytime for &f%player%&a:"
  - "&7Today: &f%today%"
  - "&7This month: &f%month%"
  - "&7All time: &f%alltime%"
playtime-last-seen: "&7Last seen: &f%lastseen%"

leaderboard-header: "%prefix%&aTop 10 Playtime - &f%period%"
leaderboard-entry: "&7#%rank% &f%player% &8- &a%time%"
leaderboard-empty: "%prefix%&7No playtime has been tracked for &f%period%&7 yet."
