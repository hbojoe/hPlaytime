storage:
  # local or mysql
  type: local

  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: root
    password: ""
    use-ssl: false
    table-prefix: hplaytime_
    # Persistence is serial; a small pool is sufficient. Values are clamped to safe bounds.
    maximum-pool-size: 2
    connection-timeout-millis: 3000
    validation-timeout-millis: 1000
    connect-timeout-millis: 3000
    socket-timeout-millis: 5000
    query-timeout-seconds: 5
    # Other servers' committed changes appear after this asynchronous refresh (1-60 seconds).
    cache-refresh-seconds: 5

date-format:
  # Use "system" for the machine/server timezone, or an ID like America/Chicago.
  timezone: system
  daily-pattern: yyyy-MM-dd
  monthly-pattern: yyyy-MM

time-format:
  # compact or long
  style: compact
  show-seconds: true
  zero: 0s

  compact:
    day: d
    hour: h
    minute: m
    second: s

  long:
    day: day
    days: days
    hour: hour
    hours: hours
    minute: minute
    minutes: minutes
    second: second
    seconds: seconds

last-seen:
  # Show a Last seen line in /playtime output.
  enabled: true
  pattern: yyyy-MM-dd HH:mm:ss z

afk:
  enabled: true
  timeout-seconds: 300

  # Players in these worlds do not gain playtime.
  worlds:
    - afk

flush-interval-seconds: 60

persistence:
  retry-interval-seconds: 5
  # Only plugin disable waits, to drain accepted writes. Normal ticks never wait for I/O.
  shutdown-timeout-seconds: 30
