storage:
  # local or mysql
  type: local

  mysql:
    host: localhost
    port: 3306
    database: minecraft
    username: root
    password: ""
    use-ssl: false
    table-prefix: hplaytime_

date-format:
  # Use "system" for the machine/server timezone, or an ID like America/Chicago.
  timezone: system
  daily-pattern: yyyy-MM-dd
  monthly-pattern: yyyy-MM

time-format:
  # compact or long
  style: compact
  show-seconds: true
  zero: 0s

  compact:
    day: d
    hour: h
    minute: m
    second: s

  long:
    day: day
    days: days
    hour: hour
    hours: hours
    minute: minute
    minutes: minutes
    second: second
    seconds: seconds

afk:
  enabled: true
  timeout-seconds: 300

  # Players in these worlds do not gain playtime.
  worlds:
    - afk

flush-interval-seconds: 60
